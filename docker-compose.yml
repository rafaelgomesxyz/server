services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    depends_on:
      - mysql
    networks:
      - appnet

  cron:
    build: .
    restart: unless-stopped
    command: ["./docker/cron-entrypoint.sh"]
    env_file: .env
    environment:
      DB_HOST: mysql
      STEAMGIFTS_PLAYWRIGHT_HEADLESS: "false"
      STEAMGIFTS_PLAYWRIGHT_USER_DATA_DIR: /app/.cache/steamgifts-playwright-chrome
    depends_on:
      - mysql
    volumes:
      - cron_cache:/app/.cache
    networks:
      - appnet

  mysql:
    image: mysql:8.4
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet
    ports:
      - "127.0.0.1:3306:3306"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - appnet

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  cron_cache:

networks:
  appnet:
